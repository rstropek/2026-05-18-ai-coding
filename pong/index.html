<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #060810;
        color: #e8ecf5;
        font-family: system-ui, -apple-system, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .stage {
        position: relative;
        width: 800px;
        max-width: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      #startBtn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px 56px;
        font-size: 36px;
        font-weight: 900;
        letter-spacing: 4px;
        background: #ffd33d;
        color: #1a1a1a;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        transition: transform 0.1s ease;
      }
      #startBtn:hover {
        transform: translate(-50%, -50%) scale(1.05);
      }
      .hint {
        margin-top: 16px;
        text-align: center;
        color: #6c7896;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="stage">
        <canvas id="game" width="800" height="500"></canvas>
        <button id="startBtn" type="button">START</button>
      </div>
      <p class="hint">Left player: W / S &nbsp;·&nbsp; Right player: ↑ / ↓</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
